name: Run WA-MV-Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Restore WhatsApp Session Cache
        uses: actions/cache@v4
        with:
          path: auth_info
          key: wa-session-${{ github.run_id }}
          restore-keys: |
            wa-session-

      - name: Run WhatsApp Bot
        env:
          CHAMA_CINESUBZ_API_KEY: ${{ secrets.CHAMA_CINESUBZ_API_KEY }}
          REQUEST_GROUP_JID: ${{ secrets.REQUEST_GROUP_JID }}
          MOVIE_GROUP_JID: ${{ secrets.MOVIE_GROUP_JID }}
        run: node index.js
